name: Sync IX Main to Client

on:
  push:
    branches:
      - main

jobs:
  sync:
    name: Sync IX Main to Client

    if: github.repository == 'Mayank-53/ix-sync-demo'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ---------------------------------------------
      # 1. Checkout IX repository
      # ---------------------------------------------
      - name: Checkout IX repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # ---------------------------------------------
      # 2. Configure Git
      # ---------------------------------------------
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------
      # 3. Add client repository
      # ---------------------------------------------
      - name: Add client repository
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          git remote add client \
            "https://x-access-token:${CLIENT_TOKEN}@github.com/Mayank-53/client-sync-demo.git"

      # ---------------------------------------------
      # 4. Verify client access
      # ---------------------------------------------
      - name: Verify client repository access
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          git ls-remote \
            "https://x-access-token:${CLIENT_TOKEN}@github.com/Mayank-53/client-sync-demo.git"

      # ---------------------------------------------
      # 5. Push exact IX main to client main
      # ---------------------------------------------
      - name: Sync exact main branch
        run: |
          git push client \
            refs/heads/main:refs/heads/main \
            --force

      # ---------------------------------------------
      # 6. Verify SHA
      # ---------------------------------------------
      - name: Verify commit SHA
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          SOURCE_SHA=$(git rev-parse refs/heads/main)

          CLIENT_SHA=$(git ls-remote \
            "https://x-access-token:${CLIENT_TOKEN}@github.com/Mayank-53/client-sync-demo.git" \
            refs/heads/main | awk '{print $1}')

          echo "IX SHA:     $SOURCE_SHA"
          echo "Client SHA: $CLIENT_SHA"

          if [ "$SOURCE_SHA" = "$CLIENT_SHA" ]; then
            echo "======================================"
            echo "SHA MATCH SUCCESSFUL"
            echo "======================================"
          else
            echo "======================================"
            echo "SHA MISMATCH"
            echo "======================================"
            exit 1
          fi
