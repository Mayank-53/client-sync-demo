name: Sync IX Main to Client

on:
  push:
    branches:
      - main

jobs:
  sync:
    name: Sync Main Branch to Client
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ------------------------------------------------
      # 1. Checkout IX repository
      # ------------------------------------------------
      - name: Checkout IX repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: ix-repo

      # ------------------------------------------------
      # 2. Configure Git
      # ------------------------------------------------
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------
      # 3. Clone client repository
      # ------------------------------------------------
      - name: Clone client repository
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${CLIENT_TOKEN}@github.com/Mayank-53/client-sync-demo.git" \
            client-repo

      # ------------------------------------------------
      # 4. Synchronize application code
      # ------------------------------------------------
      - name: Sync application code
        run: |
          rsync -av \
            --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            ix-repo/ \
            client-repo/

      # ------------------------------------------------
      # 5. Check changes
      # ------------------------------------------------
      - name: Check synchronized changes
        working-directory: client-repo
        run: |
          echo "Changes to be synchronized:"
          git status --short

      # ------------------------------------------------
      # 6. Commit changes in client repository
      # ------------------------------------------------
      - name: Commit changes
        working-directory: client-repo
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to synchronize."
          else
            git commit -m "Sync code from IX main"
          fi

      # ------------------------------------------------
      # 7. Push to client main
      # ------------------------------------------------
      - name: Push to client main
        working-directory: client-repo
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          git push origin main

      # ------------------------------------------------
      # 8. Verify
      # ------------------------------------------------
      - name: Verify synchronization
        working-directory: client-repo
        run: |
          git pull origin main

          echo ""
          echo "======================================"
          echo "Synchronization successful"
          echo "======================================"

          echo ""
          echo "Client branch:"
          git branch --show-current

          echo ""
          echo "Latest client commit:"
          git log -1 --oneline
