name: Sync IX Main to Client Main

on:
  push:
    branches:
      - main

jobs:
  sync:
    name: Sync Main Branch to Client
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. Checkout IX repository
      - name: Checkout IX repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. Configure Git
      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3. Add client repository
      - name: Add client repository
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          git remote add client \
            "https://x-access-token:${CLIENT_TOKEN}@github.com/Mayank-53/client-sync-demo.git"

      # 4. Verify client repository access
      - name: Verify client repository access
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          git ls-remote \
            "https://x-access-token:${CLIENT_TOKEN}@github.com/Mayank-53/client-sync-demo.git"

      # 5. Push IX main to client main
      - name: Sync main branch
        run: |
          git push client \
            HEAD:refs/heads/main \
            --force

      # 6. Verify synchronization
      - name: Verify synchronization
        run: |
          git fetch client main

          SOURCE_COMMIT=$(git rev-parse HEAD)
          CLIENT_COMMIT=$(git rev-parse client/main)

          echo "Source commit: $SOURCE_COMMIT"
          echo "Client commit: $CLIENT_COMMIT"

          if [ "$SOURCE_COMMIT" = "$CLIENT_COMMIT" ]; then
            echo "Synchronization successful."
          else
            echo "Synchronization failed."
            exit 1
          fi
