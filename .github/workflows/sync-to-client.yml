name: Sync to Client Repository

on:
  push:
    branches:
      - "**"

jobs:
  sync:
    name: Sync IX Repository to Client
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout IX repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check client token
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          if [ -z "$CLIENT_TOKEN" ]; then
            echo "ERROR: CLIENT_REPO_TOKEN is empty or unavailable"
            exit 1
          fi

          echo "CLIENT_REPO_TOKEN is available"

      - name: Test client authentication
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
        run: |
          git ls-remote \
            "https://x-access-token:${CLIENT_TOKEN}@github.com/Mayank-53/client-sync-demo.git"
